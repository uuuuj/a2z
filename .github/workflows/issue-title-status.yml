name: Issue 제목 상태 동기화

on:
  issues:
    types:
      - opened
      - edited
      - labeled
      - unlabeled
      - reopened

permissions:
  contents: read
  issues: write

jobs:
  sync-title-prefix:
    runs-on: ubuntu-latest
    steps:
      - name: 상태 라벨과 제목 접두사 동기화
        uses: actions/github-script@v9
        with:
          script: |
            const statuses = [
              { label: '상태: API 확인', prefix: '[API 확인]' },
              { label: '상태: API 요청 필요', prefix: '[API 요청 필요]' },
              { label: '상태: API 대기', prefix: '[API 대기]' },
              { label: '상태: 분석 필요', prefix: '[분석 필요]' },
              { label: '상태: 개발 대기', prefix: '[개발 대기]' },
              { label: '상태: 개발 중', prefix: '[개발 중]' },
              { label: '상태: 실기 확인', prefix: '[실기 확인]' },
            ];

            const issue = context.payload.issue;
            const currentLabels = issue.labels.map((label) => label.name);
            const incomingLabel = context.payload.label?.name;
            const incomingStatus = statuses.find((status) => status.label === incomingLabel);
            let selected = incomingStatus ?? statuses.find((status) => currentLabels.includes(status.label));

            if (!selected) {
              selected = statuses.find((status) => status.label === '상태: 개발 대기');
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: [selected.label],
              });
            }

            for (const status of statuses) {
              if (status.label === selected.label || !currentLabels.includes(status.label)) {
                continue;
              }

              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  name: status.label,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            const knownPrefixes = statuses.map((status) => status.prefix.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
            const prefixPattern = new RegExp(`^(?:${knownPrefixes.join('|')})\\s*`);
            const cleanTitle = issue.title.replace(prefixPattern, '').trim();
            const desiredTitle = `${selected.prefix} ${cleanTitle}`;

            if (issue.title !== desiredTitle) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                title: desiredTitle,
              });
            }
