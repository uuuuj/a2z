name: API 개발 필요
description: 새 API 추가 또는 기존 SDK 수정 필요가 확인된 항목입니다.
title: "[API 개발] "
labels:
  - "상태: API 개발"
body:
  - type: textarea
    id: requirement
    attributes:
      label: 필요한 API 개발 내용
      description: 필요한 메서드·옵션·동작 또는 수정해야 할 SDK 현상을 작성합니다.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: API 개발이 필요하다고 판단한 근거
      description: 기존 API 확인 결과, 재현 로그, 샘플 등을 작성합니다.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: API 완료 확인 기준
      description: 새 API 또는 수정본을 받았을 때 확인할 조건을 작성합니다.
    validations:
      required: true
