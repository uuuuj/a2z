name: 분석 필요
description: 재현 조건·요구 기준·정책 또는 구현 방법을 먼저 정해야 하는 항목입니다.
title: "[분석 필요] "
labels:
  - "상태: 분석 필요"
body:
  - type: textarea
    id: problem
    attributes:
      label: 문제 또는 검토 대상
      description: 분석하려는 현상이나 결정이 필요한 내용을 작성합니다.
    validations:
      required: true
  - type: textarea
    id: questions
    attributes:
      label: 확인할 사항
      description: 재현 조건, 데이터, 정책, 구현 후보 등을 작성합니다.
    validations:
      required: true
  - type: textarea
    id: exit_criteria
    attributes:
      label: 분석 완료 기준
      description: 어떤 결론이 나면 개발 대기 또는 API 확인으로 전환할지 작성합니다.
    validations:
      required: false
